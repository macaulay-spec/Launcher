name: Build Astra Launcher APK

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: write

jobs:
  build-apk:
    name: Compile, Test & Package Full Astra APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Configure Pre-Installed Android SDK & Accept Licenses
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          yes | ${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          chmod +x ./gradlew

      - name: Generate PKCS12 Release Signing Keystore
        run: |
          rm -f app/astra-release.jks
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore app/astra-release.jks \
            -alias astra-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass astra_release_2026 \
            -keypass astra_release_2026 \
            -dname "CN=Astra Launcher, OU=Astra OS Systems, O=Astra, L=San Francisco, ST=CA, C=US"

      - name: Run Unit Tests & Build Debug + Signed Release APKs
        env:
          ASTRA_KEYSTORE_PASSWORD: astra_release_2026
          ASTRA_KEY_ALIAS: astra-key
          ASTRA_KEY_PASSWORD: astra_release_2026
        run: |
          set -o pipefail
          if ! ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace 2>&1 | tee gradle-build.log; then
            ERR_MSG=$(grep -v "checkKotlinGradlePluginConfigurationErrors" gradle-build.log | grep -iE "^e: |FAILURE:|went wrong|Execution failed|Unresolved|AAPT|error:" -A 5 | head -n 40 | tr '\n' ' ' | cut -c 1-900)
            echo "::error title=GradleBuildFailure::$ERR_MSG"
            exit 1
          fi

      - name: Collect & Verify Built APKs
        run: |
          mkdir -p artifacts/apk
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/apk/AstraLauncher-v1.0.0-debug.apk
          cp app/build/outputs/apk/release/app-release.apk artifacts/apk/AstraLauncher-v1.0.0-release-signed.apk
          ls -lh artifacts/apk/
          sha256sum artifacts/apk/*.apk > artifacts/apk/SHA256SUMS.txt
          cat artifacts/apk/SHA256SUMS.txt
          APK_SUMMARY=$(ls -lh artifacts/apk/*.apk | awk '{print $9 " (" $5 ")"}' | tr '\n' ' ')
          echo "::notice title=AstraAPKsBuiltSuccessfully::$APK_SUMMARY"

      - name: Upload Astra Launcher Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstraLauncher-Debug-APK
          path: artifacts/apk/AstraLauncher-v1.0.0-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload Astra Launcher Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstraLauncher-Release-Signed-APK
          path: |
            artifacts/apk/AstraLauncher-v1.0.0-release-signed.apk
            artifacts/apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish APKs to GitHub Release (v1.0.0)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --yes --cleanup-tag || true
          gh release create v1.0.0 \
            artifacts/apk/AstraLauncher-v1.0.0-debug.apk \
            artifacts/apk/AstraLauncher-v1.0.0-release-signed.apk \
            artifacts/apk/SHA256SUMS.txt \
            --target "${{ github.sha }}" \
            --title "Astra Launcher v1.0.0 — Full Android OS Environment" \
            --notes "Automated build of all 16 Astra Launcher Android modules (Kotlin + Jetpack Compose). Includes signed release APK, debug APK, 5 curated wallpapers, offline command search, and full 40-frame visual inventory."
