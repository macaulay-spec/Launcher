name: Build Astra Launcher APK

on:
  push:
    branches: [arena/67cc6168-launcher]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      # Self-reporting build: this sandbox cannot read Actions logs (blob host
      # blocked), so results are committed back to the branch. The commit-message
      # check is a loop guard: a run checked out at a "ci: record ..." commit
      # never commits again, so each state triggers at most one extra run.
      - name: Build debug APK
        id: build
        run: |
          chmod +x ./gradlew
          mkdir -p ci
          if ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee ci/build-full.log; then
            echo "result=success" >> "$GITHUB_OUTPUT"
            tail -n 150 ci/build-full.log > ci/last-build.log
            {
              echo "status: SUCCESS"
              echo "pwd: $(pwd)"
              find app/build/outputs -type f -name "*.apk" -exec ls -la {} \; 2>&1
              APK=$(find app/build/outputs -type f -name "app-debug.apk" 2>/dev/null | head -1)
              echo "apk_path: ${APK:-NONE}"
              if [ -n "$APK" ]; then
                echo "size: $(stat -c%s "$APK") bytes"
                echo "sha256: $(sha256sum "$APK" | cut -d' ' -f1)"
              fi
            } > ci/last-build.txt
            git config user.name "astra-ci"
            git config user.email "astra-ci@users.noreply.github.com"
            git rm -q ci/last-build-failure.log 2>/dev/null || true
            git add ci/last-build.txt ci/last-build.log
            if [ "$(git log -1 --pretty=%s)" = "ci: record successful build" ]; then
              echo "loop guard: previous commit already recorded a success"
            else
              git commit -q -m "ci: record successful build" || true
              git push origin HEAD:arena/67cc6168-launcher || true
            fi
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
            cp ci/build-full.log ci/last-build-failure.log
            git config user.name "astra-ci"
            git config user.email "astra-ci@users.noreply.github.com"
            git add ci/last-build-failure.log
            if [ "$(git log -1 --pretty=%s)" = "ci: record build failure log" ]; then
              echo "loop guard: previous commit already recorded a failure"
            else
              git commit -q -m "ci: record build failure log" || true
              git push origin HEAD:arena/67cc6168-launcher || true
            fi
            exit 1
          fi

      - name: Upload APK artifact
        if: steps.build.outputs.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: astra-launcher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
